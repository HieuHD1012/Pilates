services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pilates
      POSTGRES_PASSWORD: pilates
      POSTGRES_DB: pilates_fe_test
      TZ: UTC
    ports: ["127.0.0.1:5435:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pilates -d pilates_fe_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1026:1025", "127.0.0.1:8026:8025"]
