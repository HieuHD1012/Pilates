[project]
name = "pilates-be"
version = "0.1.0"
description = "Backend quản lý & đặt lớp Pilates — FastAPI + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "nh3>=0.2.19",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "flake8-datetimez>=20.10.0",
    "piexif>=1.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# DTZ = flake8-datetimez: chặn naive datetime ở tầng lint (F00, bắt buộc).
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query` trong tham số mặc định là cách khai báo của FastAPI,
# không phải lỗi mutable-default mà B008 nhắm tới.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Test được phép dựng datetime naive để chứng minh hệ thống từ chối chúng.
"tests/*" = ["DTZ001", "DTZ005"]
# Thân migration do Alembic sinh; định dạng lại tay sẽ lệch với lần sinh sau.
"alembic/versions/*" = ["E501"]
