name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.12.0"

jobs:
  verify:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

      # The invariants that silently break a static SPA: missing pre-rendered
      # documents, a missing SPA fallback, ssr:false flipped, SEO content that
      # only exists after hydration, or fixtures leaking into the bundle.
      - name: Build contract
        run: npm run check:build-contract

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-client
          path: build/client
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run e2e:install
      - run: npm run build

      # Playwright serves build/client through scripts/serve-dist.mjs, which
      # reproduces the CDN's SPA-fallback behaviour, so deep links and
      # pre-rendered documents are exercised exactly as deployed.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
