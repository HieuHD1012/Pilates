name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend — verify and UI regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src_FE/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run e2e:install
      - run: npm run e2e -- --project=desktop --project=mobile --project=app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-playwright
          path: |
            src_FE/playwright-report
            src_FE/test-results

  frontend-api:
    name: Frontend — built artifact and real API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pilates
          POSTGRES_PASSWORD: pilates
          POSTGRES_DB: pilates_fe_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pilates -d pilates_fe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql+psycopg://pilates:pilates@localhost:5434/pilates_fe_test
      JWT_SECRET: ci-only-disposable-jwt-secret-0123456789
      ENVIRONMENT: test
      CORS_ORIGINS: '["http://localhost:4173"]'
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-disposable-admin-password
      VITE_API_BASE_URL: http://127.0.0.1:8000
      RUN_LIVE_API: "true"
      LIVE_API_URL: http://127.0.0.1:8000
      MAILPIT_URL: http://127.0.0.1:8025
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      EMAIL_FROM: studio@example.com
      PASSWORD_RESET_URL_TEMPLATE: http://localhost:4173/dat-lai-mat-khau?token={token}
      STORAGE_DIR: /tmp/pilates-live-storage
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src_FE/package-lock.json
      - name: Install backend and frontend dependencies
        run: |
          cd src_BE && uv sync --frozen
          cd ../src_FE && npm ci && npm run e2e:install
      - name: Live browser suite twice on fresh databases
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2; do
            cd "$GITHUB_WORKSPACE/src_BE"
            uv run python -m scripts.live_e2e reset
            uv run alembic upgrade head
            uv run alembic check
            uv run python -m scripts.seed_admin
            uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/pilates-api.log 2>&1 &
            api_pid=$!
            trap 'kill "$api_pid" 2>/dev/null || true' EXIT
            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then cat /tmp/pilates-api.log; exit 1; fi
            cd "$GITHUB_WORKSPACE/src_FE"
            result=0
            npm run e2e:live || result=$?
            mkdir -p "visual-qa/live/run-$round"
            cp -R playwright-report test-results "visual-qa/live/run-$round/"
            cp /tmp/pilates-api.log "visual-qa/live/run-$round/backend.log"
            ../src_BE/.venv/bin/python ../scripts/redact_live_artifacts.py "visual-qa/live/run-$round/test-results" "visual-qa/live/run-$round/playwright-report"
            cd "$GITHUB_WORKSPACE/src_BE"
            uv run python -m scripts.live_e2e reconcile
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            trap - EXIT
            if [ "$result" -ne 0 ]; then exit "$result"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-live-api
          path: |
            src_FE/visual-qa/live
            src_FE/playwright-report
            src_FE/test-results

  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_BE

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pilates
          POSTGRES_PASSWORD: pilates
          POSTGRES_DB: pilates_test
          TZ: UTC
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pilates -d pilates_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://pilates:pilates@localhost:5434/pilates_test
      JWT_SECRET: ci-secret-0123456789
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # Rule DTZ chặn naive datetime — lệch 7 giờ vượt cả hai ngưỡng hủy 4h/1h.
      - name: Lint (gồm cổng chặn naive datetime)
        run: uv run ruff check .

      - name: Kiểm migration khớp model
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://pilates:pilates@localhost:5434/pilates_test

      - name: Test
        run: uv run pytest -q

      # Lượt hai dưới giờ studio. Runner chạy UTC, máy dev chạy giờ Việt Nam,
      # và độ lệch 7 giờ vượt cả hai ngưỡng hủy 4h/1h — một phép quy đổi sai sẽ
      # cho hai kết quả khác nhau ở đúng các test này.
      - name: Test quy tắc thời gian dưới giờ studio
        run: uv run pytest -q tests/test_timezone_boundaries.py tests/test_timezone_rules.py tests/test_booking_rules.py tests/test_classes_api.py tests/test_reports.py tests/test_renewal_reminders.py tests/test_attendance_api.py tests/test_registration_policy.py
        env:
          TZ: Asia/Ho_Chi_Minh
